<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38484b"/>
      <stop offset="0.58" stop-color="#2d3d3e"/>
      <stop offset="1" stop-color="#223233"/>
    </linearGradient>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162326"/>
      <stop offset="1" stop-color="#263538"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e292b"/>
      <stop offset="1" stop-color="#10191c"/>
    </linearGradient>
    <linearGradient id="rainWindow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8790"/>
      <stop offset="0.45" stop-color="#354f59"/>
      <stop offset="1" stop-color="#142b35"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="0" r="70%">
      <stop offset="0" stop-color="#e6b863" stop-opacity="0.56"/>
      <stop offset="0.42" stop-color="#bd833d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8a592b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cotBlanket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59665c"/>
      <stop offset="1" stop-color="#303d39"/>
    </linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#958261"/>
      <stop offset="1" stop-color="#514932"/>
    </linearGradient>
    <pattern id="wallSpeckle" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect x="5" y="7" width="4" height="4" fill="#7a8c83" opacity="0.10"/>
      <rect x="37" y="18" width="7" height="3" fill="#0d1b1c" opacity="0.18"/>
      <rect x="19" y="43" width="3" height="6" fill="#9caf9f" opacity="0.08"/>
      <rect x="50" y="51" width="4" height="3" fill="#101c1d" opacity="0.20"/>
    </pattern>
    <pattern id="floorBoards" width="256" height="96" patternUnits="userSpaceOnUse">
      <rect width="256" height="96" fill="none"/>
      <path d="M0 94H256M254 0V96" stroke="#344044" stroke-width="4" opacity="0.68"/>
      <path d="M0 7H256" stroke="#0c1517" stroke-width="4" opacity="0.55"/>
    </pattern>
    <pattern id="quilt" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="url(#cotBlanket)"/>
      <path d="M0 36H72M36 0V72" stroke="#788070" stroke-width="3" opacity="0.34"/>
      <path d="M0 0L72 72M72 0L0 72" stroke="#24302e" stroke-width="2" opacity="0.3"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

